[project]
name = "agentcy"
version = "0.1.0"
description = "Agentcy — single CLI entry point for the agent suite"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "agentcy-protocols",
    "agentcy-briefs",
    "agentcy-forecast",
    "agentcy-measure",
    "agentcy-voice",
]

[project.scripts]
agentcy = "agentcy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcy"]

[tool.uv.workspace]
members = [".", "protocols", "briefs", "forecast", "measure", "voice"]

[tool.uv.sources]
agentcy-protocols = { workspace = true }
agentcy-briefs   = { workspace = true }
agentcy-forecast = { workspace = true }
agentcy-measure  = { workspace = true }
agentcy-voice    = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
