[project]
name = "agentcy-protocols"
version = "0.1.0"
description = "Shared schemas and adapters for the agentcy suite"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcy_protocols"]

[tool.hatch.build.targets.sdist]
include = [
    "/adapters",
    "/examples",
    "/*.schema.json",
    "/src/agentcy_protocols",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"adapters/run_result_to_performance_v1.py" = "agentcy_protocols/_run_result_to_performance_v1.py"
"brief.v1.schema.json" = "agentcy_protocols/schemas/brief.v1.schema.json"
"forecast.v1.schema.json" = "agentcy_protocols/schemas/forecast.v1.schema.json"
"performance.v1.schema.json" = "agentcy_protocols/schemas/performance.v1.schema.json"
"run_result.v1.schema.json" = "agentcy_protocols/schemas/run_result.v1.schema.json"
"voice_pack.v1.schema.json" = "agentcy_protocols/schemas/voice_pack.v1.schema.json"
"examples" = "agentcy_protocols/examples"
